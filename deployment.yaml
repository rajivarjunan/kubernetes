apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    tier: frontend
    env: test
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        name: myapp
        tier: frontend
        env: test
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]