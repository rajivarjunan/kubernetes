apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-config
  namespace: pki
data:
  ca.json: |
    {
      "root": "/home/step/certs/root_ca.crt",
      "crt": "/home/step/certs/intermediate_ca.crt",
      "key": "/home/step/secrets/intermediate_ca_key",
      "address": ":9000",
      "dnsNames": ["step-ca.pki.svc.cluster.local"],
      "logger": {"format": "text"},
      "db": {"type": "badgerv2", "dataSource": "/home/step/db"},
      "authority": {
        "provisioners": [{
          "type": "ACME",
          "name": "k3s-acme",
          "claims": {
            "minTLSCertDuration": "5m",
            "defaultTLSCertDuration": "24h",
            "maxTLSCertDuration": "720h"
          }
        }]
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: step-ca
  namespace: pki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: step-ca
  ports:
    - name: https
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: step-ca-db
  namespace: pki
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: step-ca
  namespace: pki
spec:
  serviceName: step-ca
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: step-ca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: step-ca
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: step-ca
          image: smallstep/step-ca:0.29.0
          imagePullPolicy: IfNotPresent
          args: ["/home/step/config/ca.json", "--password-file", "/home/step/secrets/password"]
          ports:
            - name: https
              containerPort: 9000
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: https
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /home/step/config
              readOnly: true
            - name: ca-secrets
              mountPath: /home/step/certs
              readOnly: true
            - name: ca-secrets
              mountPath: /home/step/secrets
              readOnly: true
            - name: db
              mountPath: /home/step/db
      volumes:
        - name: config
          configMap:
            name: step-ca-config
        - name: ca-secrets
          secret:
            secretName: step-ca-secrets
            defaultMode: 0440
        - name: db
          persistentVolumeClaim:
            claimName: step-ca-db
